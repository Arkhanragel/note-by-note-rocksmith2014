<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="The marks used on the cards, the Then row and the tab, with their names"><defs><linearGradient id="nbn-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1a30"/><stop offset="1" stop-color="#09090f"/></linearGradient></defs><rect width="1040" height="460" rx="10" fill="url(#nbn-bg)"/><rect x="45.6" y="27.2" width="24.8" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="52.4" y="46.5" font-size="18.7" font-weight="700" fill="#141418">h</text><text x="104" y="36.6" font-size="16" font-weight="700" fill="#ffffff" textLength="91.3" lengthAdjust="spacingAndGlyphs">Hammer-on</text><text x="104" y="55.5" font-size="13" font-weight="400" fill="#afafb9" textLength="259.2" lengthAdjust="spacingAndGlyphs">no&#160;pick:&#160;hit&#160;the&#160;fret&#160;hard&#160;with&#160;a&#160;fretting&#160;finger</text><rect x="45.4" y="73.2" width="25.2" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="52.2" y="92.5" font-size="18.7" font-weight="700" fill="#141418">p</text><text x="104" y="82.6" font-size="16" font-weight="700" fill="#ffffff" textLength="56.8" lengthAdjust="spacingAndGlyphs">Pull-off</text><text x="104" y="101.5" font-size="13" font-weight="400" fill="#afafb9" textLength="261" lengthAdjust="spacingAndGlyphs">no&#160;pick:&#160;pull&#160;the&#160;finger&#160;off&#160;so&#160;the&#160;note&#160;sounds</text><rect x="45.7" y="119.2" width="24.6" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="52.5" y="138.5" font-size="18.7" font-weight="700" fill="#141418">T</text><text x="104" y="128.6" font-size="16" font-weight="700" fill="#ffffff" textLength="28" lengthAdjust="spacingAndGlyphs">Tap</text><text x="104" y="147.6" font-size="13" font-weight="400" fill="#afafb9" textLength="250.2" lengthAdjust="spacingAndGlyphs">hit&#160;the&#160;fret&#160;with&#160;a&#160;finger&#160;of&#160;the&#160;picking&#160;hand</text><rect x="36.5" y="165.2" width="43" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="43.3" y="184.5" font-size="18.7" font-weight="700" fill="#141418" textLength="29.4" lengthAdjust="spacingAndGlyphs">PM</text><text x="104" y="174.6" font-size="16" font-weight="700" fill="#ffffff" textLength="81.4" lengthAdjust="spacingAndGlyphs">Palm&#160;mute</text><text x="104" y="193.6" font-size="13" font-weight="400" fill="#afafb9" textLength="300.6" lengthAdjust="spacingAndGlyphs">the&#160;picking&#160;hand&#160;rests&#160;on&#160;the&#160;strings&#160;near&#160;the&#160;bridge</text><rect x="45" y="211.2" width="25.9" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="51.8" y="230.5" font-size="18.7" font-weight="700" fill="#141418">X</text><text x="104" y="220.6" font-size="16" font-weight="700" fill="#ffffff" textLength="88.8" lengthAdjust="spacingAndGlyphs">Muted&#160;note</text><text x="104" y="239.6" font-size="13" font-weight="400" fill="#afafb9" textLength="267.1" lengthAdjust="spacingAndGlyphs">touch&#160;the&#160;string&#160;without&#160;pressing&#160;it:&#160;a&#160;dull&#160;click</text><rect x="38.3" y="257.2" width="39.4" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="45.1" y="276.5" font-size="18.7" font-weight="700" fill="#141418" textLength="25.8" lengthAdjust="spacingAndGlyphs">PH</text><text x="104" y="266.6" font-size="16" font-weight="700" fill="#ffffff" textLength="116.8" lengthAdjust="spacingAndGlyphs">Pinch&#160;harmonic</text><text x="104" y="285.6" font-size="13" font-weight="400" fill="#afafb9" textLength="237.1" lengthAdjust="spacingAndGlyphs">the&#160;thumb&#160;grazes&#160;the&#160;string&#160;as&#160;you&#160;pick&#160;it</text><rect x="40" y="303.2" width="36" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="46.8" y="322.5" font-size="18.7" font-weight="700" fill="#141418" textLength="22.4" lengthAdjust="spacingAndGlyphs">TP</text><text x="104" y="312.6" font-size="16" font-weight="700" fill="#ffffff" textLength="122.9" lengthAdjust="spacingAndGlyphs">Tremolo&#160;picking</text><text x="104" y="331.6" font-size="13" font-weight="400" fill="#afafb9" textLength="224.5" lengthAdjust="spacingAndGlyphs">pick&#160;the&#160;note&#160;very&#160;fast,&#160;again&#160;and&#160;again</text><rect x="46" y="349.2" width="24.1" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="52.8" y="368.5" font-size="18.7" font-weight="700" fill="#141418">S</text><text x="104" y="358.6" font-size="16" font-weight="700" fill="#ffffff" textLength="32" lengthAdjust="spacingAndGlyphs">Slap</text><text x="104" y="377.6" font-size="13" font-weight="400" fill="#afafb9" textLength="265.1" lengthAdjust="spacingAndGlyphs">hit&#160;the&#160;string&#160;with&#160;the&#160;side&#160;of&#160;the&#160;thumb&#160;(bass)</text><rect x="34" y="395.2" width="48" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="40.8" y="414.5" font-size="18.7" font-weight="700" fill="#141418" textLength="34.4" lengthAdjust="spacingAndGlyphs">Pop</text><text x="104" y="404.6" font-size="16" font-weight="700" fill="#ffffff" textLength="29.4" lengthAdjust="spacingAndGlyphs">Pop</text><text x="104" y="423.6" font-size="13" font-weight="400" fill="#afafb9" textLength="314.1" lengthAdjust="spacingAndGlyphs">hook&#160;the&#160;string&#160;with&#160;a&#160;finger&#160;and&#160;let&#160;it&#160;snap&#160;back&#160;(bass)</text><rect x="552.1" y="27.2" width="21.8" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="558.9" y="46.5" font-size="18.7" font-weight="700" fill="#141418">/</text><text x="609" y="36.6" font-size="16" font-weight="700" fill="#ffffff" textLength="60.6" lengthAdjust="spacingAndGlyphs">Slide&#160;up</text><text x="609" y="55.5" font-size="13" font-weight="400" fill="#afafb9" textLength="244.3" lengthAdjust="spacingAndGlyphs">to&#160;a&#160;higher&#160;fret,&#160;keeping&#160;the&#160;string&#160;pressed</text><rect x="552.1" y="73.2" width="21.8" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="558.9" y="92.5" font-size="18.7" font-weight="700" fill="#141418">\</text><text x="609" y="82.6" font-size="16" font-weight="700" fill="#ffffff" textLength="83.2" lengthAdjust="spacingAndGlyphs">Slide&#160;down</text><text x="609" y="101.5" font-size="13" font-weight="400" fill="#afafb9" textLength="238.8" lengthAdjust="spacingAndGlyphs">to&#160;a&#160;lower&#160;fret,&#160;keeping&#160;the&#160;string&#160;pressed</text><rect x="550.4" y="119.2" width="25.2" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="557.2" y="138.5" font-size="18.7" font-weight="700" fill="#141418">b</text><text x="609" y="128.6" font-size="16" font-weight="700" fill="#ffffff" textLength="38.6" lengthAdjust="spacingAndGlyphs">Bend</text><text x="609" y="147.6" font-size="13" font-weight="400" fill="#afafb9" textLength="258.6" lengthAdjust="spacingAndGlyphs">push&#160;the&#160;string&#160;sideways&#160;so&#160;the&#160;note&#160;goes&#160;up</text><rect x="549.6" y="165.2" width="26.9" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="556.4" y="184.5" font-size="18.7" font-weight="700" fill="#141418">~</text><text x="609" y="174.6" font-size="16" font-weight="700" fill="#ffffff" textLength="56.2" lengthAdjust="spacingAndGlyphs">Vibrato</text><text x="609" y="193.6" font-size="13" font-weight="400" fill="#afafb9" textLength="199.3" lengthAdjust="spacingAndGlyphs">shake&#160;the&#160;note&#160;a&#160;little&#160;while&#160;it&#160;rings</text><rect x="549.6" y="211.2" width="26.9" height="25.5" rx="6.8" fill="#f5f5f5" stroke="#141418" stroke-width="2"/><text x="556.4" y="230.5" font-size="18.7" font-weight="700" fill="#141418">&gt;</text><text x="609" y="220.6" font-size="16" font-weight="700" fill="#ffffff" textLength="51.2" lengthAdjust="spacingAndGlyphs">Accent</text><text x="609" y="239.6" font-size="13" font-weight="400" fill="#afafb9" textLength="166.7" lengthAdjust="spacingAndGlyphs">play&#160;it&#160;louder&#160;than&#160;the&#160;others</text><rect x="536" y="252.4" width="54.4" height="35.2" rx="6.4" fill="#0e0e14" stroke="#8a8a96" stroke-width="2.08"/><circle cx="550.4" cy="274.8" r="4.2" fill="#ffffff"/><circle cx="576" cy="274.8" r="4.2" fill="#ffffff"/><path d="M550.4 266.8 Q563.2 255.6 576 266.8" fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round"/><text x="609" y="266.6" font-size="16" font-weight="700" fill="#ffffff" textLength="22.6" lengthAdjust="spacingAndGlyphs">Tie</text><text x="609" y="285.6" font-size="13" font-weight="400" fill="#afafb9" textLength="272.5" lengthAdjust="spacingAndGlyphs">not&#160;picked&#160;again:&#160;the&#160;note&#160;before&#160;keeps&#160;ringing</text><polyline points="553,326 553,306 573,306 573,326" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="miter"/><text x="609" y="312.6" font-size="16" font-weight="700" fill="#ffffff" textLength="95.7" lengthAdjust="spacingAndGlyphs">Down&#160;stroke</text><text x="609" y="331.6" font-size="13" font-weight="400" fill="#afafb9" textLength="188.1" lengthAdjust="spacingAndGlyphs">the&#160;pick&#160;moves&#160;towards&#160;the&#160;floor</text><polyline points="553,352 563,372 573,352" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="miter"/><text x="609" y="358.6" font-size="16" font-weight="700" fill="#ffffff" textLength="73" lengthAdjust="spacingAndGlyphs">Up&#160;stroke</text><text x="609" y="377.6" font-size="13" font-weight="400" fill="#afafb9" textLength="198.2" lengthAdjust="spacingAndGlyphs">the&#160;pick&#160;moves&#160;towards&#160;the&#160;ceiling</text><g transform="translate(543.5,408)"><rect x="0" y="-13" width="39" height="26" rx="13" fill="#f68822"/><text x="10.4" y="5.6" font-size="16.1" font-weight="700" fill="#141418" textLength="18.2" lengthAdjust="spacingAndGlyphs">x3</text></g><text x="609" y="404.6" font-size="16" font-weight="700" fill="#ffffff" textLength="115.2" lengthAdjust="spacingAndGlyphs">Repeat&#160;counter</text><text x="609" y="423.6" font-size="13" font-weight="400" fill="#afafb9" textLength="287" lengthAdjust="spacingAndGlyphs">play&#160;it&#160;this&#160;many&#160;times;&#160;it&#160;counts&#160;down&#160;as&#160;you&#160;play</text></svg>
