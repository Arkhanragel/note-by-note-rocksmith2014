<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="A right note counts from 300 ms before its time to 150 ms after it"><defs><linearGradient id="nbn-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1a30"/><stop offset="1" stop-color="#09090f"/></linearGradient></defs><rect width="1040" height="250" rx="10" fill="url(#nbn-bg)"/><rect x="240" y="106" width="360" height="44" rx="3" fill="#3caf5a" opacity="0.3"/><rect x="600" y="106" width="180" height="44" rx="3" fill="#3caf5a" opacity="0.18"/><path d="M73.9 150 Q530 150 974.4 150" fill="none" stroke="#d0d0dc" stroke-width="2.9" stroke-linecap="round"/><polygon points="984.8,150 974.4,156.2 974.4,143.8" fill="#d0d0dc"/><text x="965.5" y="174.4" font-size="12.5" font-weight="400" fill="#afafb9" textLength="24.5" lengthAdjust="spacingAndGlyphs">time</text><line x1="600" y1="78" x2="600" y2="158" stroke="#ffce54" stroke-width="2.4" stroke-linecap="round"/><rect x="587" y="52" width="26" height="26" rx="5" fill="#0e0e14"/><rect x="587" y="52" width="26" height="26" rx="5" fill="none" stroke="#f68822" stroke-width="2"/><text x="595.9" y="69.9" font-size="14" font-weight="700" fill="#ffffff">7</text><text x="622" y="69.7" font-size="13.5" font-weight="600" fill="#ffce54" textLength="150.5" lengthAdjust="spacingAndGlyphs">the&#160;note&#160;reaches&#160;the&#160;line</text><text x="365.3" y="132.9" font-size="14" font-weight="600" fill="#ffffff" textLength="109.3" lengthAdjust="spacingAndGlyphs">Early&#160;notes&#160;count</text><text x="637.3" y="132.9" font-size="14" font-weight="600" fill="#ffffff" textLength="105.4" lengthAdjust="spacingAndGlyphs">Late&#160;notes&#160;count</text><line x1="240" y1="145" x2="240" y2="155" stroke="#d0d0dc" stroke-width="1.6" stroke-linecap="round"/><text x="200.5" y="176.4" font-size="12.5" font-weight="400" fill="#afafb9" textLength="79" lengthAdjust="spacingAndGlyphs">300&#160;ms&#160;before</text><line x1="600" y1="145" x2="600" y2="155" stroke="#d0d0dc" stroke-width="1.6" stroke-linecap="round"/><text x="568.2" y="176.4" font-size="12.5" font-weight="400" fill="#afafb9" textLength="63.6" lengthAdjust="spacingAndGlyphs">on&#160;the&#160;beat</text><line x1="780" y1="145" x2="780" y2="155" stroke="#d0d0dc" stroke-width="1.6" stroke-linecap="round"/><text x="745.8" y="176.4" font-size="12.5" font-weight="400" fill="#afafb9" textLength="68.4" lengthAdjust="spacingAndGlyphs">150&#160;ms&#160;after</text><rect x="771" y="84" width="7" height="20" rx="2" fill="#e19628"/><rect x="782" y="84" width="7" height="20" rx="2" fill="#e19628"/><text x="802" y="89.7" font-size="13.5" font-weight="600" fill="#e19628" textLength="116.9" lengthAdjust="spacingAndGlyphs">not&#160;played&#160;by&#160;now:</text><text x="802" y="107.7" font-size="13.5" font-weight="600" fill="#e19628" textLength="151.3" lengthAdjust="spacingAndGlyphs">the&#160;song&#160;stops&#160;and&#160;waits</text><text x="284.3" y="212.9" font-size="14" font-weight="400" fill="#ffffff" textLength="451.5" lengthAdjust="spacingAndGlyphs">Played&#160;anywhere&#160;in&#160;the&#160;green&#160;part:&#160;it&#160;counts,&#160;and&#160;the&#160;song&#160;does&#160;not&#160;stop.</text></svg>
