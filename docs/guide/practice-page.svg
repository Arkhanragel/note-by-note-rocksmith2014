cap="round"/><text x="50" y="418.7" font-size="13.5" font-weight="400" fill="#ffffff" textLength="53.7" lengthAdjust="spacingAndGlyphs">This&#160;time</text><line x1="111.7" y1="414" x2="724" y2="414" stroke="#52525f" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="444.6" font-size="13" font-weight="400" fill="#ffffff" textLength="512.4" lengthAdjust="spacingAndGlyphs">41&#160;played&#160;on&#160;time,&#160;12&#160;waited&#160;for,&#160;2&#160;skipped;&#160;3&#160;notes&#160;cleared;&#160;the&#160;longest&#160;wait:&#160;6.4&#160;s&#160;at&#160;2:25</text><line x1="36" y1="472" x2="44" y2="472" stroke="#52525f" stroke-width="1.2" stroke-linecap="round"/><text x="50" y="476.7" font-size="13.5" font-weight="400" fill="#ffffff" textLength="79.9" lengthAdjust="spacingAndGlyphs">Practice&#160;parts</text><line x1="137.9" y1="472" x2="724" y2="472" stroke="#52525f" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="502.6" font-size="13" font-weight="400" fill="#ffffff" textLength="150" lengthAdjust="spacingAndGlyphs">Waiting&#160;only&#160;in&#160;2:23&#160;-&#160;2:41</text><g opacity="1"><rect x="36" y="515" width="153.8" height="22" rx="3" fill="#771c1c"/><text x="45" y="530.5" font-size="13" font-weight="400" fill="#ffffff" textLength="135.8" lengthAdjust="spacingAndGlyphs">Practise&#160;the&#160;whole&#160;song</text></g><g opacity="1"><rect x="36" y="551" width="198.8" height="22" rx="3" fill="#771c1c"/><text x="45" y="566.5" font-size="13" font-weight="400" fill="#ffffff" textLength="180.8" lengthAdjust="spacingAndGlyphs">Forget&#160;this&#160;song&#x27;s&#160;trouble&#160;spots</text></g><text x="244.8" y="566.4" font-size="12.5" font-weight="400" fill="#7a7a86" textLength="13.1" lengthAdjust="spacingAndGlyphs">(?)</text><line x1="36" y1="598" x2="724" y2="598" stroke="#52525f" stroke-width="1" stroke-linecap="round"/><text x="36" y="622.4" font-size="12.5" font-weight="400" fill="#7a7a86" textLength="341.6" lengthAdjust="spacingAndGlyphs">Saved