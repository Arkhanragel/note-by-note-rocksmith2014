" y="570.4" font-size="12.5" font-weight="400" fill="#7a7a86" textLength="341.6" lengthAdjust="spacingAndGlyphs">Saved&#160;automatically.&#160;The&#160;song&#160;is&#160;held&#160;while&#160;this&#160;menu&#160;is&#160;open.</text><g opacity="1"><rect x="650.2" y="555" width="73.8" height="22" rx="3" fill="#771c1c"/><text x="659.2" y="570.5" font-size="13" font-weight="400" fill="#ffffff" textLength="55.8" lengthAdjust="spacingAndGlyphs">Close&#160;(F8)</text></g><text x="36" y="593.5" font-size="10" font-weight="400" fill="#7a7a86" textLength="413.8" lengthAdjust="spacingAndGlyphs">Thanks&#160;to&#160;RS_ASIO,&#160;Rocksmith2014.NET,&#160;MinHook&#160;and&#160;Dear&#160;ImGui.&#160;Not&#160;affiliated&#160;with&#160;Ubisoft.</text><circle cx="466.9" cy="70" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="463.1" y="74.5" font-size="13" font-weight="700" fill="#141418">1</text><circle cx="343.2" cy="100" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="339.5" y="104.5" font-size="13" font-weight="700" fill="#141418">2</text><circle cx="583.4" cy="100" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="579.7" y="104.5" font-size="13" font-weight="700" fill="#141418">3</text><circle cx="403.6" cy="130" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="399.9" y="134.6" font-size="13" font-weight="700" fill="#141418">4</text><circle cx="285.7" cy="192" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="282" y="196.6" font-size="13" font-weight="700" fill="#141418">5</text><circle cx="630.2" cy="566" r="11" fill="#ffce54" stroke="#141418" stroke-width="1.5"/><text x="626.5" y="570.5" font-size="13" font-weight="700" fill="#141418">6</text></svg>
